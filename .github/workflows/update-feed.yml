name: Update and deploy RSS feed

on:
  workflow_dispatch:
    inputs:
      publish_only:
        description: Deploy saved feeds without fetching sources
        type: boolean
        default: false
      conference_only:
        description: Only refresh conference feeds; keep existing journal and email feeds
        type: boolean
        default: false
  push:
    branches:
      - main
  schedule:
    - cron: "20 22 * * *"
    - cron: "30 6 * * 1-5"
    - cron: "30 12 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Select collection mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PUBLISH_ONLY: ${{ inputs.publish_only }}
        run: |
          python - <<'PY'
          import os, subprocess
          only = os.environ.get('PUBLISH_ONLY') == 'true'
          before = os.environ.get('BEFORE', '')
          if os.environ['EVENT'] == 'push' and before and set(before) != {'0'}:
              changed = subprocess.check_output(['git','diff','--name-only',before,os.environ['AFTER']],text=True).splitlines()
              only = only or bool(changed) and set(changed) <= {'read-suppression.json'}
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('filter_only=' + str(only).lower() + '\n')
          PY

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set conference cache key
        id: conference-cache-key
        shell: bash
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore conference source cache
        uses: actions/cache@v5
        with:
          path: .conference-cache
          key: ${{ runner.os }}-conference-http-${{ steps.conference-cache-key.outputs.date }}
          restore-keys: |
            ${{ runner.os }}-conference-http-

      - name: Generate unfiltered QQ arXiv email daily records
        id: mailbox
        if: inputs.conference_only != true && steps.mode.outputs.filter_only != 'true'
        continue-on-error: true
        env:
          ARXIV_EMAIL_ADDRESS: ${{ secrets.ARXIV_EMAIL_ADDRESS }}
          ARXIV_EMAIL_AUTH_CODE: ${{ secrets.ARXIV_EMAIL_AUTH_CODE }}
        run: python rss_health.py run mailbox -- python arxiv_email_daily.py

      - name: Report mailbox collection failure
        if: steps.mailbox.outcome == 'failure'
        run: echo "::warning::QQ mailbox collection failed. Existing email RSS files are retained; other feeds will still deploy."

      - name: Generate official feed mirrors
        if: steps.mode.outputs.filter_only != 'true'
        continue-on-error: true
        run: python rss_health.py run official -- python official_feed_proxy.py

      - name: Generate feed
        if: steps.mode.outputs.filter_only != 'true' && inputs.conference_only != true && (github.event_name != 'schedule' || github.event.schedule == '20 22 * * *')
        continue-on-error: true
        run: >
          python rss_health.py run journals -- python journal_rss_aggregator.py
          --start-year 2020
          --end-year 2026
          --output feed.xml
          --feed-link https://fengziclassmate.github.io/journal-rss/feed.xml

      - name: Restore conference fallback
        run: python -m zipfile -e conference-feed-fallback.zip .

      - name: Generate conference feeds
        if: steps.mode.outputs.filter_only != 'true'
        continue-on-error: true
        run: python rss_health.py run conferences -- python conference_rss.py

      - name: Save latest complete conference fallback
        if: steps.mode.outputs.filter_only != 'true'
        run: python rss_reports.py conferences

      - name: Collect accepted TMLR papers
        if: steps.mode.outputs.filter_only != 'true'
        continue-on-error: true
        run: python rss_health.py run tmlr -- python tmlr_rss.py

      - name: Merge current issues into canonical journal feeds
        run: python journal_merge.py

      - name: Enforce official priority on every publication
        run: python official_priority.py

      - name: Build health report and validate sizes
        run: |
          python rss_health.py guard
          python rss_health.py render
          python rss_reports.py duplicates
          python rss_reports.py sharing

      - name: Remove previously read Zotero items
        env:
          RSS_READ_FILTER_KEY: ${{ secrets.RSS_READ_FILTER_KEY }}
        run: >
          python rss_read_filter.py
          --root .
          --suppression read-suppression.json
          --glob "*.xml"
          --glob "conference-feeds/*.xml"
          --glob "official-feeds/*.xml"

      - name: Commit feed changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          skip_fetch: true
          skip_checkout: true
          skip_push: true
          commit_message: "Update RSS feed"
          file_pattern: >-
            read-suppression.json official-feed-seen.json *.xml official-feeds/*.xml
            research-data/*.json research-data/arxiv-email-full-state/*.json research-archive/*.json research-archive/*.html
            arxiv-email-archive/*.json arxiv-email-archive/*.html
            arxiv-email-analysis/*.json arxiv-email-analysis/*.html
            rss-health-state/*.json rss-health/*.json rss-health/*.html duplicate-audit/*.json duplicate-audit/*.html
            sharing.html official-sources.opml
            conference-feed-fallback.zip

      - name: Push feeds while preserving concurrent updates
        env:
          RSS_READ_FILTER_KEY: ${{ secrets.RSS_READ_FILTER_KEY }}
        run: python push_feed_updates.py --refresh-read-filter

      - name: Preserve generated output on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: rss-recovery-${{ github.run_id }}
          retention-days: 7
          path: |
            *.xml
            research-data/
            research-archive/
            arxiv-email-analysis/
            arxiv-email-archive/
            conference-feeds/
            conference-feeds.opml
            official-feeds/

      - name: Prepare Pages artifact
        run: |
          python -c "from rss_read_filter import write_receipt; write_receipt()"
          mkdir -p _site
          cp read-filter-status.json rss-health.xml _site/
          cp sharing.html official-sources.opml _site/
          cp ijgi.xml tmlr.xml _site/
          cp land-use-policy.xml _site/
          cp rse.xml jag.xml isprsjprs.xml computer-science-review.xml laup.xml ai.xml eiar.xml sb.xml urban-climate.xml ufug.xml tdf-ijgis.xml tdf-agis.xml csu-not-tdf-aaag.xml tdf-bed.xml tdf-gi.xml tdf-gsis.xml tdf-gisrs.xml tdf-ijrs.xml artificial-intelligence-science-and-engineering.xml transactions-on-neural-networks-and-learning-systems.xml transactions-on-intelligent-transportation-systems.xml transactions-on-image-processing.xml transactions-on-big-data.xml big-data-mining-and-analytics.xml transactions-on-artificial-intelligence.xml sd.xml communications-earth-environment.xml nature.xml nature-cities.xml nature-communications.xml nature-computational-science.xml nature-geoscience.xml nature-human-behaviour.xml nature-machine-intelligence.xml nature-reviews-earth-environment.xml nature-sustainability.xml npjus.xml smart-cities.xml journal-of-planning-literature.xml journal-of-urban-management.xml urban-studies.xml csu-not-tdf-planning-theory-practice.xml csu-not-tdf-journal-of-urban-technology.xml european-urban-and-regional-studies.xml journal-of-urban-economics.xml science-of-remote-sensing.xml tgis.xml nature-climate-change.xml buildings-cities.xml remote-sensing.xml energy-and-buildings.xml _site/
          cp -r rss-health assets duplicate-audit _site/
          cp feed.xml ijde.xml pattern-recognition.xml scs.xml asc.xml applied-geography.xml habitat-international.xml information-fusion.xml information-geography.xml building-and-environment.xml buildings.xml sustainability.xml cities.xml ceus.xml jgsa.xml essd.xml grsm-early-access.xml tgrs-early-access.xml tpami-early-access.xml ijde-current-issue.xml pattern-recognition-current-issue.xml scs-current-issue.xml asc-current-issue.xml applied-geography-current-issue.xml habitat-international-current-issue.xml information-fusion-current-issue.xml information-geography-current-issue.xml building-and-environment-current-issue.xml buildings-current-issue.xml sustainability-current-issue.xml cities-current-issue.xml ceus-current-issue.xml jgsa-current-issue.xml essd-current-issue.xml grsm-current-issue.xml tgrs-current-issue.xml tpami-current-issue.xml index.html .nojekyll _site/
          cp research-papers.xml research-daily.xml _site/
          cp -r research-archive _site/
          cp arxiv-email-papers.xml arxiv-email-daily.xml _site/
          cp -r arxiv-email-archive _site/
          cp -r arxiv-email-analysis _site/
          cp conference-feeds.opml _site/
          cp -r conference-feeds _site/
          cp -r official-feeds _site/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
